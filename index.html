<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>记忆圣所 | Memory Sanctuary</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <!-- 标题画面 -->
    <div id="title-screen">
        <div id="title-content">
            <div id="title-logo">
                <div class="title-cn">记忆圣所</div>
                <div class="title-en">MEMORY SANCTUARY</div>
                <div class="title-sub">终来之刻，何物当存？</div>
            </div>
            <div id="title-menu">
                <button class="title-btn" id="title-new">新建游戏</button>
                <button class="title-btn" id="title-load">读取存档</button>
                <button class="title-btn" id="title-help">帮助</button>
                <button class="title-btn" id="title-about">关于</button>
            </div>
            <div id="title-ngplus"></div>
        </div>
    </div>

    <!-- 游戏容器 -->
    <div id="game-container" class="hidden">
        <!-- 顶部状态栏 -->
        <header id="top-bar">
            <div class="title">
                <span class="title-cn">记忆圣所</span>
                <span class="title-en">MEMORY SANCTUARY</span>
            </div>
            <div id="week-display">
                <span class="week-label">第</span>
                <span class="week-value" id="week-value">1</span>
                <span class="week-label">周</span>
                <div id="week-progress-container">
                    <div id="week-progress"></div>
                </div>
            </div>
            <div id="resource-panel">
                <div class="resource" id="res-energy">
                    <span class="res-icon">◈</span>
                    <span class="res-label">能源</span>
                    <span class="res-value" id="energy-value">100</span>
                </div>
                <div class="resource" id="res-media">
                    <span class="res-icon">◇</span>
                    <span class="res-label">存储介质</span>
                    <span class="res-value" id="media-value">50</span>
                </div>
                <div class="resource" id="res-environment">
                    <span class="res-icon">○</span>
                    <span class="res-label">环境稳定</span>
                    <span class="res-value" id="environment-value">95</span>
                </div>
                <button id="theme-toggle" title="切换主题">◐</button>
            </div>
        </header>

        <!-- 主内容区 -->
        <main id="main-content">
            <!-- 左侧：圣所主厅 Canvas -->
            <section id="sanctuary-panel">
                <canvas id="sanctuary-canvas" width="600" height="400"></canvas>
                <div id="sanctuary-caption">圣所主厅</div>
            </section>

            <!-- 右侧：操作面板 -->
            <section id="action-panel">
                <!-- 事件通知 -->
                <div id="event-panel" class="hidden">
                    <div id="event-banner">
                        <div class="event-title" id="event-title"></div>
                        <div class="event-desc" id="event-desc"></div>
                        <div class="event-choices" id="event-choices"></div>
                    </div>
                </div>

                <!-- 守护者面板 -->
                <div id="guardian-panel">
                    <h2 class="panel-title">守护者</h2>
                    <div class="guardian-display">
                        <div class="guardian-avatar" id="guardian-avatar">🦅</div>
                        <div class="guardian-info">
                            <div class="guardian-name-row">
                                <div class="guardian-name" id="guardian-name">缇卡</div>
                                <div class="guardian-mood" id="guardian-mood">🤍</div>
                            </div>
                            <div class="guardian-role" id="guardian-role">首席歌者</div>
                            <div class="guardian-dialogue" id="guardian-dialogue">……我准备好了。让我们开始吧。</div>
                        </div>
                    </div>
                    <!-- 守护者互动菜单 -->
                    <div id="guardian-menu" class="hidden">
                        <button class="guardian-menu-item" id="guardian-talk">💬 交谈</button>
                        <button class="guardian-menu-item" id="guardian-recommend">📌 推荐归档</button>
                    </div>
                </div>

                <!-- 存储室状态 -->
                <div id="vault-status" class="panel">
                    <h2 class="panel-title">存储室</h2>
                    <div id="vault-tabs"></div>
                    <div id="vault-list"></div>
                </div>

                <!-- 待归档条目 -->
                <div id="archive-entries" class="panel">
                    <h2 class="panel-title">待归档条目</h2>
                    <div id="entry-list"></div>
                </div>
            </section>
        </main>

        <!-- 底部日志 -->
        <footer id="log-bar">
            <button id="log-toggle" title="展开/收起日志">
                <span id="log-icon">📜</span>
                <span id="log-label">日志</span>
                <span id="log-unread" class="hidden">0</span>
            </button>
        </footer>

        <!-- 日志展开面板 -->
        <div id="log-panel" class="hidden">
            <div id="log-panel-header">
                <span>系统日志</span>
                <button id="log-close">✕</button>
            </div>
            <div id="log-content">
                <p class="log-entry system">系统启动。圣所主厅已激活。</p>
                <p class="log-entry guardian">缇卡：「……我准备好了。让我们开始吧。」</p>
            </div>
        </div>

        <!-- 底部功能栏 -->
        <footer id="func-bar">
            <button id="title-btn" title="返回标题">
                <span>标题</span>
            </button>
            <button id="skip-btn" title="跳过回合">
                <span>跳过</span>
            </button>
            <button id="atlas-btn" title="文明图谱">
                <span>图谱</span>
            </button>
            <button id="explore-btn" title="地表勘探" disabled>
                <span>勘探</span>
            </button>
            <button id="project-btn" title="圣所项目" disabled>
                <span>项目</span>
            </button>
            <button id="save-btn" title="存档">
                <span>存档</span>
            </button>
            <button id="load-btn" title="读档">
                <span>读档</span>
            </button>
            <button id="help-btn" title="帮助">
                <span>帮助</span>
            </button>
            <button id="about-btn" title="关于">
                <span>关于</span>
            </button>
        </footer>
    </div>

    <!-- 归档完成弹窗 -->
    <div id="modal-overlay" class="hidden">
        <div id="modal">
            <h2 id="modal-title">归档完成</h2>
            <p id="modal-content"></p>
            <button id="modal-close">确认</button>
        </div>
    </div>

    <!-- 新手引导遮罩 -->
    <div id="tutorial-overlay" class="hidden">
        <div id="tutorial-highlight"></div>
        <div id="tutorial-tip">
            <div id="tutorial-text"></div>
            <button id="tutorial-next">下一步</button>
        </div>
    </div>

    <!-- 存档界面 -->
    <div id="save-overlay" class="hidden">
        <div id="save-panel">
            <div id="save-panel-header">
                <h2 id="save-panel-title">记忆圣所 · 存档</h2>
                <button id="save-close">✕</button>
            </div>
            <div id="save-slots"></div>
            <div id="save-info"></div>
        </div>
    </div>

    <!-- 文明图谱界面 -->
    <div id="atlas-overlay" class="hidden">
        <div id="atlas-panel">
            <div id="atlas-panel-header">
                <h2>萨拉达斯文明图谱</h2>
                <button id="atlas-close">✕</button>
            </div>
            <canvas id="atlas-canvas" width="500" height="400"></canvas>
            <div id="atlas-info"></div>
        </div>
    </div>

    <!-- 地表勘探界面 -->
    <div id="explore-overlay" class="hidden">
        <div id="explore-panel">
            <div id="explore-panel-header">
                <h2>地表勘探</h2>
                <button id="explore-close">✕</button>
            </div>
            <div id="explore-list"></div>
            <div id="explore-dispatch" class="hidden">
                <div id="dispatch-title"></div>
                <div id="dispatch-desc"></div>
                <div id="dispatch-guardians"></div>
                <div id="dispatch-outcomes"></div>
                <button id="dispatch-btn" disabled>派遣勘探队</button>
            </div>
            <div id="explore-result" class="hidden">
                <div id="result-header"></div>
                <div id="result-text"></div>
                <div id="result-effects"></div>
                <button id="result-close-btn">确认</button>
            </div>
        </div>
    </div>

    <!-- 圣所项目面板 -->
    <div id="project-overlay" class="hidden">
        <div id="project-panel">
            <div id="project-panel-header">
                <h2>圣所维护项目</h2>
                <button id="project-close">✕</button>
            </div>
            <div id="project-list"></div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/game.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/canvas.js"></script>
</body>
</html>
